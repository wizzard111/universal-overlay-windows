# Push a tag like v0.2.0: test, build and publish a GitHub release with the
# archive and SHA256SUMS.txt — exactly what update.exe downloads.
# Optional secrets: WINDOWS_SIGN_PFX_BASE64, WINDOWS_SIGN_PASSWORD (code signing).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  UO_GITHUB_REPO: ${{ github.repository }}
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: source
      - run: cargo test --workspace
      - name: Signing certificate
        shell: pwsh
        env:
          PFX: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
        run: |
          if ($env:PFX) {
            [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\sign.pfx", [Convert]::FromBase64String($env:PFX))
            "WINDOWS_SIGN_PFX=$env:RUNNER_TEMP\sign.pfx" >> $env:GITHUB_ENV
          }
      - name: Build
        shell: pwsh
        env:
          WINDOWS_SIGN_PASSWORD: ${{ secrets.WINDOWS_SIGN_PASSWORD }}
        run: ./build/build.ps1
      - name: Checksums
        shell: pwsh
        run: Copy-Item target/dist/SHA256SUMS-windows.txt target/dist/SHA256SUMS.txt
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" target/dist/universal-overlay-windows-x86_64.zip target/dist/SHA256SUMS.txt --title "$env:GITHUB_REF_NAME" --generate-notes
      - uses: actions/upload-artifact@v4
        with:
          name: universal-overlay-windows
          path: source/target/dist/*
