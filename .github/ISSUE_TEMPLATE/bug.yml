name: Ошибка
description: Что-то работает не так
labels: [ошибка]
body:
  - type: textarea
    id: what
    attributes:
      label: Что случилось
      description: Что вы делали, что ожидали увидеть и что произошло.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Версия Universal Overlay
      description: Settings → General → Updates.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Система и видеокарта
      placeholder: "Windows 11 24H2, Radeon RX 9060 XT"
  - type: textarea
    id: probe
    attributes:
      label: Вывод uo-probe
      description: Диагностика датчиков и FPS — запустите `uo-probe` из папки программы и вставьте вывод.
      render: text
