name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Universal Overlay version
      description: Settings → General → Updates.
      placeholder: "0.1.1"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System and graphics card
      placeholder: "Windows 11 24H2, Radeon RX 9060 XT"
  - type: textarea
    id: probe
    attributes:
      label: uo-probe output
      description: Sensor and FPS diagnostics — run `uo-probe` from the program folder and paste its output.
      render: text
