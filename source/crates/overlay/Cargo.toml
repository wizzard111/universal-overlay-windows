[package]
name = "universal-overlay"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[lib]
name = "uo_overlay"
path = "src/lib.rs"

[[bin]]
name = "universal-overlay"
path = "src/main.rs"

[[bin]]
name = "uo-probe"
path = "src/bin/probe.rs"

[dependencies]
ab_glyph = "0.2.32"
uo-common = { path = "../common" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_System_LibraryLoader", "Win32_System_Diagnostics_Etw", "Win32_System_Performance", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_Security", "Win32_System_Memory", "Win32_System_Time", "Win32_System_Registry"] }

[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
libloading = "0.9.1"

[build-dependencies]
embed-resource = "3.0.12"
