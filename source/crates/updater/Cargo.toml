[package]
name = "universal-overlay-updater"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
uo-common = { path = "../common" }
serde_json = "1"
sha2 = "0.10"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_Console", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
embed-resource = "3.0.12"
